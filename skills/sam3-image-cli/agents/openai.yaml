display_name: "Meta SAM 3.1 Image CLI"
short_description: "Meta SAM 3.1 image segmentation skill for reducing images to the most relevant regions before OCR or downstream visual analysis"
default_prompt: "Use the public CLI `sam3-cli`. Start with `sam3-cli --help` and `sam3-cli doctor`. If setup is incomplete, run `sam3-cli setup --language en` or `sam3-cli setup --language de`, and pick the platform-specific guide with `--platform macos-apple-silicon` or `--platform windows-cuda` when needed. Ensure the gated Hugging Face model `facebook/sam3.1` is accessible before running `sam3-cli download --version sam3.1`. On Apple Silicon prefer `--device cpu`. Segment images with `sam3-cli image`, then continue downstream work from the generated JSON file and crop directory rather than relying on the overlay alone."
